<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink: #ff4d6d;
  --pink-soft: #ff8fa3;
  --green: #4ade80;
  --gold: #c9a96e;
  --muted: rgba(255,255,255,0.32);
  --text: rgba(255,255,255,0.8);
}

html, body {
  width: 100%; height: 100%;
  background: #080808;
  color: var(--text);
  font-family: 'Fira Code', monospace;
  font-weight: 300;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.045) 3px, rgba(0,0,0,0.045) 4px
  );
  pointer-events: none;
  z-index: 900;
}

#petals {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 50;
  overflow: hidden;
}
.petal {
  position: absolute;
  top: -16px;
  opacity: 0;
  animation: petalFall linear forwards;
}
@keyframes petalFall {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.88; }
  75%  { opacity: 0.65; }
  100% { transform: translateY(114vh) rotate(560deg) scale(0.6); opacity: 0; }
}

#console {
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity 0.7s ease;
}
#console.out { opacity: 0; pointer-events: none; }

.console-wrap {
  width: 100%;
  max-width: 520px;
  padding: 28px 24px;
}

.c-line {
  display: flex;
  gap: 10px;
  min-height: 24px;
  margin-bottom: 9px;
  font-size: clamp(11.5px, 3vw, 13.5px);
  line-height: 1.65;
}
.c-tag   { color: rgba(255,77,109,0.48); flex-shrink: 0; }
.c-green { color: var(--green); }
.c-muted { color: var(--muted); font-style: italic; }
.c-gold  { color: var(--gold); }
.c-pink  { color: var(--pink-soft); }

.cursor {
  display: inline-block;
  width: 7px; height: 13px;
  background: var(--pink-soft);
  vertical-align: middle;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.c-row { opacity: 0; transition: opacity 0.35s; }
.c-row.show { opacity: 1; }

#decrypt-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  padding: 12px 26px;
  border: 1px solid rgba(255,77,109,0.28);
  background: rgba(255,77,109,0.05);
  color: var(--pink-soft);
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s, transform 0.5s, background 0.3s, border-color 0.3s;
}
#decrypt-btn.show { opacity: 1; transform: translateY(0); }
#decrypt-btn:active {
  background: rgba(255,77,109,0.13);
  border-color: rgba(255,77,109,0.55);
}

.hint {
  font-size: 10px;
  letter-spacing: 0.16em;
  color: rgba(255,255,255,0.13);
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.5s 0.3s;
  animation: hintPulse 2.8s ease-in-out infinite;
}
.hint.show { opacity: 1; }
@keyframes hintPulse { 0%,100%{opacity:0.16} 50%{opacity:0.45} }

.corner {
  position: fixed;
  font-size: 9.5px;
  letter-spacing: 0.11em;
  line-height: 1.85;
  color: rgba(255,255,255,0.06);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 20;
}
.corner.tl { top: 18px; left: 18px; }
.corner.br { bottom: 18px; right: 18px; }

#easter {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  pointer-events: none;
  display: flex;
  gap: 10px;
  align-items: center;
}
.star-dot {
  color: rgba(255,143,163,0.18);
  font-size: 13px;
  animation: starBreathe ease-in-out infinite;
}
.star-dot:nth-child(1) { animation-duration: 3.1s; animation-delay: 0s; }
.star-dot:nth-child(2) { animation-duration: 2.7s; animation-delay: 0.6s; font-size: 9px; }
.star-dot:nth-child(3) { animation-duration: 3.5s; animation-delay: 1.1s; }
.star-dot:nth-child(4) { animation-duration: 2.9s; animation-delay: 0.3s; font-size: 9px; }
.star-dot:nth-child(5) { animation-duration: 3.2s; animation-delay: 0.9s; }
@keyframes starBreathe {
  0%,100% { opacity: 0.15; transform: scale(1); }
  50%      { opacity: 0.55; transform: scale(1.25); }
}

#heart-view {
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.9s ease;
  z-index: 10;
}
#heart-view.in { opacity: 1; pointer-events: auto; }

#heart-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}

.heart-symbol {
  position: relative;
  z-index: 5;
  text-align: center;
  opacity: 0;
  transition: opacity 1.2s 2.6s;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
#heart-view.in .heart-symbol { opacity: 1; }

.symbol-main {
  font-size: 22px;
  color: var(--pink);
  text-shadow: 0 0 28px rgba(255,77,109,0.5);
  animation: symbolPulse 3s ease-in-out infinite;
  line-height: 1;
}
@keyframes symbolPulse {
  0%,100% { text-shadow: 0 0 18px rgba(255,77,109,0.35); }
  50%      { text-shadow: 0 0 36px rgba(255,77,109,0.65); }
}

.symbol-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.sdot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(255,77,109,0.35);
  animation: sdotPulse ease-in-out infinite;
}
.sdot:nth-child(1) { animation-duration:2.4s; animation-delay:0s; }
.sdot:nth-child(2) { animation-duration:2.4s; animation-delay:0.4s; width:5px; height:5px; }
.sdot:nth-child(3) { animation-duration:2.4s; animation-delay:0.8s; }
@keyframes sdotPulse {
  0%,100% { opacity:0.3; transform:scale(1); }
  50%      { opacity:0.9; transform:scale(1.4); }
}

#re-encrypt {
  display: block;
  background: none; border: none;
  color: rgba(255,255,255,0.14);
  font-family: 'Fira Code', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.3s;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
  padding: 6px 0;
}
#re-encrypt:active { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<div id="petals"></div>

<div class="corner tl">
  <div>protocol // heart</div>
  <div>version: 29.05</div>
  <div>cipher: aes-256</div>
</div>
<div class="corner br">heart.protocol // ок</div>

<div id="easter">
  <span class="star-dot">✦</span>
  <span class="star-dot">·</span>
  <span class="star-dot">✦</span>
  <span class="star-dot">·</span>
  <span class="star-dot">✦</span>
</div>

<div id="console">
  <div class="console-wrap">

    <div class="c-line">
      <span class="c-tag">[sistem]</span>
      <span id="typer"></span><span class="cursor" id="cursor"></span>
    </div>

    <div class="c-line c-row" id="row-1">
      <span class="c-tag">[download]</span>
      <span>modulу &nbsp;<span class="c-green">✓</span></span>
    </div>

    <div class="c-line c-row" id="row-2">
      <span class="c-tag">[search]</span>
      <span>target: <span class="c-pink">UwU.exe</span> &nbsp;<span class="c-green">знайдено</span></span>
    </div>

    <div class="c-line c-row" id="row-3">
      <span class="c-tag">[respect]</span>
      <span class="c-muted">state: (98.6%)</span>
    </div>

    <div class="c-line c-row" id="row-4">
      <span class="c-tag">[···]</span>
      <span class="c-gold">//I'm waiting for the day when I have the courage to say...</span>
    </div>

    <div class="c-line c-row" id="row-5">
      <span class="c-tag">[data]</span>
      <span class="c-muted">&gt; encrypted data found</span>
    </div>

    <div class="c-row" id="row-btn" style="margin-top:20px">
      <button id="decrypt-btn">
        <span>🔒</span>
        <span>Decrypt Message</span>
        <span class="cursor" style="width:6px;height:11px"></span>
      </button>
      <p class="hint" id="hint">(♥)</p>
    </div>

  </div>
</div>

<div id="heart-view">
  <canvas id="heart-canvas"></canvas>

  <div class="heart-symbol">
    <div class="symbol-main">✦</div>
    <div class="symbol-dots">
      <div class="sdot"></div>
      <div class="sdot"></div>
      <div class="sdot"></div>
    </div>
    <button id="re-encrypt">↩ re-encrypt</button>
  </div>
</div>

<script>
let stage = 'console';
let consoleReady = false;

const consoleEl  = document.getElementById('console');
const heartView  = document.getElementById('heart-view');
const typerEl    = document.getElementById('typer');
const cursorEl   = document.getElementById('cursor');
const decryptBtn = document.getElementById('decrypt-btn');
const reEncBtn   = document.getElementById('re-encrypt');
const hintEl     = document.getElementById('hint');
const petalsEl   = document.getElementById('petals');

const msg = 'Initializing...';
let ti = 0;
function typeNext() {
  if (ti < msg.length) {
    typerEl.textContent += msg[ti++];
    setTimeout(typeNext, 38);
  } else {
    cursorEl.style.display = 'none';
    revealRows();
  }
}

const rowIds = ['row-1','row-2','row-3','row-4','row-5','row-btn'];
function revealRows() {
  rowIds.forEach((id, i) => {
    setTimeout(() => {
      document.getElementById(id).classList.add('show');
      if (id === 'row-btn') {
        decryptBtn.classList.add('show');
        hintEl.classList.add('show');
        consoleReady = true;
      }
    }, 280 + i * 360);
  });
}

function goReveal() {
  if (stage !== 'console' || !consoleReady) return;
  stage = 'heart';
  consoleEl.classList.add('out');
  setTimeout(() => {
    heartView.classList.add('in');
    spawnPetals(58);
    startHeart();
  }, 500);
}

function goConsole() {
  stage = 'console';
  heartView.classList.remove('in');
  stopHeart();
  clearPetals();
  setTimeout(() => consoleEl.classList.remove('out'), 400);
}

decryptBtn.addEventListener('click', e => { e.stopPropagation(); goReveal(); });
reEncBtn.addEventListener('click',   e => { e.stopPropagation(); goConsole(); });
document.addEventListener('click',   () => { if (stage === 'console') goReveal(); });

function spawnPetals(n) {
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 6 + Math.random() * 10;
      const hue  = 336 + Math.random() * 24;
      const dur  = 5.5 + Math.random() * 7.5;
      p.style.cssText = `
        left:${Math.random()*100}%;
        width:${size}px;height:${size}px;
        background:hsl(${hue},66%,${72+Math.random()*13}%);
        animation-duration:${dur}s;
        animation-delay:${Math.random()*3.5}s;
        border-radius:${Math.random()>.5?'50% 0 50% 0':'0 50% 0 50%'};
      `;
      petalsEl.appendChild(p);
      setTimeout(() => p.remove(), (dur + 4) * 1000);
    }, Math.random() * 2000);
  }
}
function clearPetals() { petalsEl.innerHTML = ''; }

const canvas = document.getElementById('heart-canvas');
const ctx    = canvas.getContext('2d');
let pts = [], startTime = null, rafId = null;

function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
function hy(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

function initPts() {
  pts = [];
  const dpr = devicePixelRatio;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  const cx = W / 2, cy = H / 2;
  const sc = Math.min(W, H) / 46;

  // ♡ — маленький символ, тому збільшуємо шрифт і зменшуємо крок
  const word = '♡';

  for (let t = 0; t < Math.PI*2; t += 0.042) {
    pts.push({ x:cx+hx(t)*sc, y:cy+hy(t)*sc,
               a:0, ta:0.7+Math.random()*0.3, d:Math.random()*1700, w:word });
  }
  for (let s = 0.22; s < 1; s += 0.22) {
    for (let t = 0; t < Math.PI*2; t += 0.095) {
      pts.push({ x:cx+hx(t)*sc*s, y:cy+hy(t)*sc*s,
                 a:0, ta:0.28+Math.random()*0.38, d:Math.random()*2900, w:word });
    }
  }
  startTime = null;
}

function resizeCanvas() {
  const dpr = devicePixelRatio;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  initPts();
}

function drawFrame(now) {
  if (!startTime) startTime = now;
  const el = now - startTime;
  const dpr = devicePixelRatio;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  ctx.clearRect(0, 0, W, H);
  // більший шрифт щоб ♡ добре виглядало і заповнювало форму
  ctx.font = '16px "Fira Code", monospace';
  for (const p of pts) {
    if (el > p.d) p.a += (p.ta - p.a) * 0.022;
    if (p.a < 0.008) continue;
    ctx.fillStyle = `rgba(255,77,109,${p.a})`;
    const ww = ctx.measureText(p.w).width;
    ctx.fillText(p.w, p.x - ww/2, p.y);
  }
  rafId = requestAnimationFrame(drawFrame);
}

function startHeart() {
  resizeCanvas();
  rafId = requestAnimationFrame(drawFrame);
}
function stopHeart() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  const dpr = devicePixelRatio;
  ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
}

window.addEventListener('resize', () => { if (stage === 'heart') resizeCanvas(); });

setTimeout(typeNext, 500);
</script>
</body>
</html>
